<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.swayam</title>
  <meta name="description" content="Swayam Talukder. I am my first project.">
  <meta name="theme-color" content="#15130F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315130F'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23D4AF37'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/im-fell-english-sc.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nanum-pen-script.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="journey" id="journey">
    <div class="stage" aria-hidden="true">
      <canvas id="terrain" class="terrain"></canvas>
      <canvas id="terrain-lit" class="terrain-lit"></canvas>
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="vignette"></div>
    </div>
  </section>

  <!-- the map sheet: frame, title, north arrow -->
  <div class="sheet" aria-hidden="true">
    <div class="neatline"></div>
    <div class="charted" id="charted"><span>charted to</span> <b id="year">2003</b></div>
    <svg class="north" viewBox="0 0 40 64" aria-hidden="true">
      <path d="M20 6 L28 40 L20 33 L12 40 Z" />
      <path class="half" d="M20 6 L20 33 L12 40 Z" />
      <text x="20" y="58" text-anchor="middle">N</text>
    </svg>
  </div>

  <header class="hud-top">
    <a class="wordmark" href="#" aria-label=".swayam, back to the start"><span class="dot">.</span>swayam</a>
    <ol class="letters" id="letters" aria-label="SWAYAM"></ol>
  </header>

  <section class="intro" id="intro">
    <h1 class="intro-mark"><span class="dot">.</span>swayam</h1>
    <p class="intro-line">I am my first project.</p>
    <p class="intro-hint">Scroll to start the journey</p>
  </section>

  <aside class="legend" id="legend" aria-hidden="true">
    <div class="files" id="files"></div>
    <div class="key">
      <span><i class="k-glow"></i>writing</span>
      <span><i class="k-blink"></i>on and off</span>
      <span><i class="k-saved"></i>saved</span>
    </div>
    <div class="scale"><i id="scalebar"></i><span id="scaletext">1 year</span></div>
  </aside>

  <article class="beat" id="beat" aria-live="polite"></article>

  <div class="tip" id="tip" role="tooltip"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <!-- The journey ends here. The sections that follow it go below. -->
  <section class="after" id="after">
    <p class="after-line">I am my first project.</p>
  </section>

  <script src="data.js"></script>
  <script src="map.js"></script>
</body>
</html>
